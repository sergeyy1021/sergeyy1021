##
## ЗАПИСЬ ЗНАНИЯ — ОДНА, ЦЕЛИКОМ.
##
## Выписана дословно из работающей базы EKC3: Knowledge/Расчёты/11-шпонки/
## формулы.yaml, строки 22–83. Ничего не сокращено, включая комментарии.
##
## Читать её стоит по четырём местам:
##
##   source      откуда взято и НАСКОЛЬКО ЭТО ПРОВЕРЕНО. Знак ◐ означает
##               «перенесено, документ не сверялся». Проверенное и
##               непроверенное различаются пометкой, а не памятью автора.
##
##   note        как читать границы. Диаметр ровно на границе принадлежит
##               нижней строке, и это сказано словами — а не оставлено
##               порядку строк в таблице.
##
##   range       сама выборка: таблица, аргумент, границы «свыше — до
##               включительно». Запись не вычисляет, а читает стандарт.
##
##   self_checks контрольные примеры, и у каждого сказано, ЧЕМ он проверен:
##               `source` — числом из документа, `invariant` — тем, что
##               обязано выполняться само по себе. Три из пяти примеров
##               стоят на границах нарочно: 50 — конец интервала, 44 — не
##               начало следующего, 38,5 — бывшая щель между строками.
##
## Чего в записи НЕТ: детали. Запись не знает, к чему её применят, и сама
## этого не решает — на деталь её ставит человек.
##

  - id: key.width-by-shaft
    label: Ширина шпонки по диаметру вала
    status: normative
    source: >
      ГОСТ 23360-78, таблица сечений призматических шпонок: сечение b×h
      назначается диапазону диаметров вала. ◐ ПЕРЕНЕСЕНО из redu_spec.md,
      п. 1; документ не сверялся.
    note: >
      Границы прочитаны так, как их пишет ГОСТ: «свыше A до B включительно».
      Диаметр ровно на границе принадлежит НИЖНЕЙ строке — 50 мм это ещё
      14×9, а не 16×10, — и никакой порядок строк на выбор не влияет.
      Отсутствие перекрытий загрузчик проверяет сам.
    range:
      table: keys.parallel.gost23360
      argument: d_mm
      from: shaft_d_over_mm
      to: shaft_d_max_mm
      bounds: over-to
      value: width_b_mm
    inputs:
      d_mm: {}
    output: { name: key_width_b_mm }
    self_checks:
      ## Диаметр 45 — начало интервала 45…50, сечение 14×9.
      - inputs: { d_mm: { value: 45, unit: mm } }
        expect: { value: 14, unit: mm }
        verified_against: source
        source_ref: "ГОСТ 23360-78 через redu_spec.md, п. 1: строка «44…50 → 14×9»"
        tolerance: 0.000001
      ##
      ## Граничный диаметр 50: конец интервала 45…50 и НЕ начало следующего
      ## (51…58). Проверка ловит перекрытие, из-за которого прежняя система
      ## выбирала сечение порядком строк.
      ##
      - inputs: { d_mm: { value: 50, unit: mm } }
        expect: { value: 14, unit: mm }
        verified_against: invariant
        tolerance: 0.000001
      ## Тот же диаметр в других единицах — тот же ответ.
      - inputs: { d_mm: { value: 4.5, unit: cm } }
        expect: { value: 14, unit: mm }
        verified_against: invariant
        tolerance: 0.000001
      ##
      ## Нижняя граница НЕ принадлежит строке: 44 мм — это ещё 12×8, а 14×9
      ## начинается СВЫШЕ сорока четырёх. Проверка ловит чтение интервала
      ## замкнутым, при котором 44 попало бы в обе строки сразу.
      ##
      - inputs: { d_mm: { value: 44, unit: mm } }
        expect: { value: 12, unit: mm }
        verified_against: source
        source_ref: "ГОСТ 23360-78: «свыше 38 до 44» → 12×8"
        tolerance: 0.000001
      ##
      ## Дробный диаметр на бывшей щели: 38,5 мм. При записи целыми
      ## интервалами ([31,38] и [39,44]) он не попадал никуда.
      ##
      - inputs: { d_mm: { value: 38.5, unit: mm } }
        expect: { value: 12, unit: mm }
        verified_against: invariant
        tolerance: 0.000001
