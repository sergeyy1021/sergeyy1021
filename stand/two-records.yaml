##
## TWO RECORDS THAT PRODUCE ONE QUANTITY.
##
## Copied verbatim from the EKC2 knowledge base, file
## Knowledge/Formulas/gear.yaml: `gear.working-width` is lines 315–346,
## `gear.face-width` is lines 514–552. Nothing has been shortened or reworded,
## comments included. They are in Russian because the base is; the point they
## make can be checked without reading a word of it.
##
## Both are `status: normative`, both cite the same source (Dunaev §10.4), and
## both declare the same `output: { name: b_w_mm }`. Look at the `output:` line
## of each — that is the whole case.
##
## What they mean, for a reader who does not read the language:
##
##   gear.face-width     the DESIGN face width: how wide to make the rim,
##                       b = ψ_ba · a_w, a relative-width factor times the
##                       centre distance;
##   gear.working-width  the WORKING face width: how much of the rim is
##                       actually in contact — the smaller of the two rims of
##                       a pair, because the pinion is made 3…5 mm wider than
##                       the wheel so that axial misalignment cannot reduce
##                       the contact.
##
## Two different engineering quantities. One quantity for the system, because
## a quantity is identified by its NAME. That is the whole mechanism, and the
## rest of the case follows from it.
##

# ── record 1 ──────────────────────────────────────────────────────────

  - id: gear.working-width
    status: normative
    source: >
      Дунаев §10.4: в расчёт входит рабочая ширина венца — общая часть двух
      венцов. Шестерню делают шире колеса на 3…5 мм, чтобы неточность осевой
      установки не уменьшала контакт; несёт нагрузку меньшая ширина.
    note: >
      Существующая система такого различия не знает: у неё ширина одна на
      пару (`b = ceil(ψ_ba·a_w/5)·5`, gear-sizing.ts:194), и оба колеса
      получают её целиком. Здесь ширина принадлежит телу, и рабочая
      получается как меньшая из двух — то же число у обеих сторон пары.
    expression: "min(b_mm, mate.b_mm)"
    inputs:
      b_mm:      { unit: mm }
      mate.b_mm: { unit: mm }
    output: { name: b_w_mm, unit: mm }
    self_checks:
      ## Шестерня шире колеса на 5 мм — работает меньшая ширина.
      - inputs:
          b_mm:      { value: 60, unit: mm }
          mate.b_mm: { value: 55, unit: mm }
        expect:    { value: 55, unit: mm }
        verified_against: self-computed
        tolerance: 0.000000001
      ## Венцы равной ширины — она и есть рабочая.
      - inputs:
          b_mm:      { value: 30, unit: mm }
          mate.b_mm: { value: 30, unit: mm }
        expect:    { value: 30, unit: mm }
        verified_against: self-computed
        tolerance: 0.000000001

# ── record 2 ──────────────────────────────────────────────────────────

  - id: gear.face-width
    status: normative
    source: >
      Дунаев §10.4: b = ψ_ba · a_w. ○ ПРОЧИТАНО из gear-sizing.ts:194, где
      результат дополнительно округляется вверх до 5 мм.
    note: >
      Ширина венца — единственная величина пары, которая НЕ перебирается по
      ряду: стандартного ряда ширин не существует, её берут расчётной. Отсюда
      и жанр: это формула, а не выбор из множества.

      Округление до 5 мм, которое делает существующая система, — удобство
      технолога, а не знание: ширину назначают кратной, чтобы не плодить
      размеров инструмента и заготовок. Сюда оно не перенесено, и расхождение
      по ширине с эталоном ожидаемо, ограничено сверху 5 мм и объяснимо.

      Сам ψ_ba приходит требованием изделия и зависит от расположения колеса
      относительно опор (Tables/gear-face-width.yaml). Пока компоновки нет,
      расположение объявляет человек — временно, и в таблице сказано почему.
    expression: "psi_ba * aw_mm"
    inputs:
      psi_ba: { unit: "1" }
      aw_mm:  { unit: mm }
    output: { name: b_w_mm, unit: mm }
    self_checks:
      ## Симметричное расположение, a_w = 175,205 → 55,2 мм. Существующая
      ## система округляет это до 60.
      - inputs:
          psi_ba: { value: 0.315, unit: "1" }
          aw_mm:  { value: 175.205, unit: mm }
        expect:    { value: 55.189575, unit: mm }
        verified_against: reference-implementation
        tolerance: 0.000001
      ## Консольное расположение при том же межосевом — венец уже на треть.
      - inputs:
          psi_ba: { value: 0.2, unit: "1" }
          aw_mm:  { value: 175.205, unit: mm }
        expect:    { value: 35.041, unit: mm }
        verified_against: self-computed
        tolerance: 0.000001
