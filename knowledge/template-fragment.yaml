##
## ПОРЯДОК РАСЧЁТА ОДНОСТУПЕНЧАТОГО ЦИЛИНДРИЧЕСКОГО РЕДУКТОРА.
##
## Перенесено 9 сентября 2026 из `redu_spec.md`, п. 21 «Порядок итераций
## (управляющий алгоритм)». До этого дня порядок содержал четыре строчки про
## вал при полутора сотнях записей в базе: шкаф был набит, дверей не было.
##
## ═══════════════════════════════════════════════════════════════════════════
## ПОРЯДОК — ЭТО ЗНАНИЕ, А НЕ ПРОГРАММА.
##
## «Сначала материалы, потом межосевое, потом геометрия» не следует из
## зависимостей между величинами и не восстанавливается из кода. Другой автор
## расставит иначе и будет прав. Поэтому порядок лежит здесь, рядом с
## формулами, и правится так же — как знание.
##
## ШАГ ОБЪЯВЛЕН ПО РОДУ, А НЕ ПО ТЕЛУ. В порядке стоит «вал», а не «вал
## быстроходный»: порядок один на все валы. Наложенный на изделие, шаг
## размножается по числу тел этого рода.
##
## ШАГ НЕ ЗНАЕТ, ЧЕМ СЧИТАТЬ. Он говорит, ЧТО должно появиться и в каком
## порядке; чем именно — назначает человек.
##
## ДВА ВИДА ШАГА, И ТОЛЬКО ДВА. Либо `gives` — должна появиться величина, либо
## `verifies` — должно быть проверено условие. Совмещать нельзя: проверка,
## попутно дающая число, спрятала бы происхождение этого числа внутрь вердикта.
##
## ОБЩЕГО ИСПОЛНИТЕЛЯ У ЭТОГО ПОРЯДКА НЕТ: стадии и шаги проходит человек, и
## петли объявлены затем, чтобы было видно, откуда куда возвращаются и что при
## этом меняется. Порядок без петель ВРЁТ, показывая расчёт прямой линией там,
## где он замкнут в круг.
##
## ОДНА ПЕТЛЯ ВСЁ ЖЕ ИСПОЛНЯЕТСЯ (поправка 17.09.2026): `LOOP_BEARING_LIFE` —
## её обороты крутит расчёт, и имя это зашито в код, а не выбрано порядком.
## Подъёма по лестнице в ней нет: ступень каждый оборот нижняя.
## ═══════════════════════════════════════════════════════════════════════════
##
kind: order
version: 1

stages:

  - id: kinematics
    label: Кинематика и энергетика
    purpose: моменты и обороты на каждом валу — из чего считается всё остальное
    steps:
      ## redu_spec.md §3, обратный ход: задание даёт выход (n, T тихоходного вала). До 19.09.2026
      ## эти шаги стояли без формул — клало ядро (узел `n-kinematics-out-of-core`).
      - { id: eta-total,     label: КПД редуктора общий,                 gives: eta_total,   formula: kin.efficiency-total }
      - { id: output-speed,  label: частота вращения выходного вала,     gives: n_rpm,       formula: kin.output-speed }
      - { id: output-torque, label: момент на выходном валу,             gives: torque_Nm,   formula: kin.output-torque }
      - { id: input-speed,   label: частота вращения входного вала,      gives: n_rpm,       formula: kin.speed-up }
      - { id: input-torque,  label: момент на входном валу,              gives: torque_Nm,   formula: kin.torque-back }
      - { id: angular-speed, label: угловая скорость вала,               gives: omega_rad_s, formula: kin.angular-speed }

  ## … ещё 17 стадий и 217 шагов: материалы, проектный расчёт пары, геометрия
  ## зацепления, контакт, изгиб, перегрузка, силы, вал предварительно, ступени
  ## вала, шпонки, тело колеса, компоновка, балка, подшипники, усталость вала,
  ## корпус и смазка.

loops:

  - id: LOOP_GEAR_CONTACT
    label: Контактная прочность не сошлась
    to: gear-design
    from: gear-contact
    when: "перегрузка выше +5 % или недогрузка глубже −15 %"
    change: >
      сначала ширина венца в пределах ряда ψ_ba, затем межосевое на шаг ряда.
      Порядок именно такой: ширина дешевле — она не меняет корпус.
    converged: отклонение в коридоре от −15 % до +5 %
    seed: >
      коэффициент ширины венца ψ_ba — назначается конструктором из ряда
      (series.gear.width-factor) до первого прохода. ТЗ, п. 5.1: от него через
      ψbd = 0,5·ψ_ba·(u+1) берётся K_Hβ, и только потом считается межосевое.
      Значение стартовое: петля его же и меняет первым делом — «сначала ширина
      венца в пределах ряда, затем межосевое на шаг».
    ## ◐ БЮДЖЕТ ШИРЕ ДОПУСТИМОГО. Здесь назван весь ряд ψ_ba, а ТЗ сужает
    ## его по расположению колеса: при несимметричном допустимы лишь 0,25,
    ## 0,315 и 0,40 (запись gear.width-factor). Петля, дойдя до 0,63, подала
    ## бы значение, которого источник не разрешает. Не чинится сейчас потому,
    ## что петля не исполнялась ни разу, — но при её написании это первое, что
    ## надо согласовать: бюджет обязан считаться по СУЖЕННОМУ подмножеству.
    budget: [series.gear.width-factor, series.gear.centre-distance]
    until: [overload, underload]
    next:
      - { when: overload,  step: width-factor,    formula: gear.width-factor-next }
      - { when: overload,  step: centre-distance, formula: gear.centre-distance-next }
      - { when: underload, step: width-factor,    formula: gear.width-factor-previous }
    diagnosis:
      - { symptom: "межосевое растёт третий раз подряд", means: "материал колеса слаб для момента: поднимать твёрдость или менять сталь, а не габарит" }
      - { symptom: "недогрузка не уходит при наименьшей ширине", means: "передача переразмерена заданием: проверить требуемое отношение и ресурс" }

  ## … ещё 5 петель: изгиб, пиковая нагрузка, ресурс подшипников,
  ## усталость вала, компоновка.
