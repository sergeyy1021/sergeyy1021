##
## ONE KNOWLEDGE RECORD, IN FULL.
##
## Copied verbatim from the working EKC3 base: Knowledge/Расчёты/11-шпонки/
## формулы.yaml, lines 22–83. Nothing shortened, comments included. It is in
## Russian because the base is; what it does is readable from the structure.
##
## The record picks the cross-section of a parallel key from the diameter of
## the shaft it sits on (GOST 23360-78, the counterpart of DIN 6885). Four
## places are worth looking at:
##
##   source      where it comes from and HOW WELL THAT IS VERIFIED. The sign ◐
##               means "transferred, the document itself was not checked
##               against". Verified and unverified differ by a mark, not by
##               the author's memory.
##
##   note        how to read the interval boundaries. A diameter exactly on a
##               boundary belongs to the LOWER row — 50 mm is still 14×9, not
##               16×10 — and that is stated in words, not left to the order of
##               rows in the table.
##
##   range       the lookup itself: table, argument, bounds "over A to B
##               inclusive". The record does not compute, it reads a standard:
##               there is no key section between rows, so nothing is
##               interpolated.
##
##   self_checks control examples, each saying WHAT it is verified against:
##               `source` — a number from the document, with the row quoted;
##               `invariant` — something that must hold by itself (the same
##               diameter in centimetres gives the same answer). Three of the
##               five sit on boundaries deliberately: 50 is the end of an
##               interval, 44 is not yet the start of the next one, 38.5 is a
##               gap that existed while intervals were written as whole
##               numbers.
##
## What the record does NOT contain: a part. It does not know what it will be
## applied to, and does not decide that — a human puts it on a part.
##

  - id: key.width-by-shaft
    label: Ширина шпонки по диаметру вала
    status: normative
    source: >
      ГОСТ 23360-78, таблица сечений призматических шпонок: сечение b×h
      назначается диапазону диаметров вала. ◐ ПЕРЕНЕСЕНО из redu_spec.md,
      п. 1; документ не сверялся.
    note: >
      Границы прочитаны так, как их пишет ГОСТ: «свыше A до B включительно».
      Диаметр ровно на границе принадлежит НИЖНЕЙ строке — 50 мм это ещё
      14×9, а не 16×10, — и никакой порядок строк на выбор не влияет.
      Отсутствие перекрытий загрузчик проверяет сам.
    range:
      table: keys.parallel.gost23360
      argument: d_mm
      from: shaft_d_over_mm
      to: shaft_d_max_mm
      bounds: over-to
      value: width_b_mm
    inputs:
      d_mm: {}
    output: { name: key_width_b_mm }
    self_checks:
      ## Диаметр 45 — начало интервала 45…50, сечение 14×9.
      - inputs: { d_mm: { value: 45, unit: mm } }
        expect: { value: 14, unit: mm }
        verified_against: source
        source_ref: "ГОСТ 23360-78 через redu_spec.md, п. 1: строка «44…50 → 14×9»"
        tolerance: 0.000001
      ##
      ## Граничный диаметр 50: конец интервала 45…50 и НЕ начало следующего
      ## (51…58). Проверка ловит перекрытие, из-за которого прежняя система
      ## выбирала сечение порядком строк.
      ##
      - inputs: { d_mm: { value: 50, unit: mm } }
        expect: { value: 14, unit: mm }
        verified_against: invariant
        tolerance: 0.000001
      ## Тот же диаметр в других единицах — тот же ответ.
      - inputs: { d_mm: { value: 4.5, unit: cm } }
        expect: { value: 14, unit: mm }
        verified_against: invariant
        tolerance: 0.000001
      ##
      ## Нижняя граница НЕ принадлежит строке: 44 мм — это ещё 12×8, а 14×9
      ## начинается СВЫШЕ сорока четырёх. Проверка ловит чтение интервала
      ## замкнутым, при котором 44 попало бы в обе строки сразу.
      ##
      - inputs: { d_mm: { value: 44, unit: mm } }
        expect: { value: 12, unit: mm }
        verified_against: source
        source_ref: "ГОСТ 23360-78: «свыше 38 до 44» → 12×8"
        tolerance: 0.000001
      ##
      ## Дробный диаметр на бывшей щели: 38,5 мм. При записи целыми
      ## интервалами ([31,38] и [39,44]) он не попадал никуда.
      ##
      - inputs: { d_mm: { value: 38.5, unit: mm } }
        expect: { value: 12, unit: mm }
        verified_against: invariant
        tolerance: 0.000001
